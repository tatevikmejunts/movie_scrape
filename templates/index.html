<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinogomy Downloader</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #1f2833;
            --surface-light: #2a3544;
            --text: #c5c6c7;
            --heading: #66fcf1;
            --accent: #45a29e;
            --accent-hover: #5bc6bf;
            --danger: #ef476f;
            --success: #06d6a0;
            --warning: #ffd166;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 1.5rem 0 2rem;
        }

        header h1 {
            color: var(--heading);
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0.4rem 0 0;
            color: #8b949e;
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }

        .card h2 {
            color: var(--heading);
            font-size: 1.15rem;
            margin: 0 0 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8b949e;
            margin: 0.9rem 0 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input, select {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            border-radius: 0.65rem;
            border: 1px solid #374151;
            background: var(--surface-light);
            color: #f0f0f0;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(69, 162, 158, 0.15);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            margin-top: 1.1rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 0.65rem;
            background: linear-gradient(135deg, var(--accent), #3d8b88);
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        button:disabled {
            background: #3a444f;
            cursor: not-allowed;
            filter: none;
        }

        .btn-secondary {
            background: var(--surface-light);
            border: 1px solid #4b5563;
            color: var(--text);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .status {
            margin-top: 0.9rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: rgba(102, 252, 241, 0.08);
            color: var(--heading);
            font-size: 0.9rem;
            min-height: 2.75rem;
            display: flex;
            align-items: center;
        }

        .status.done { background: rgba(6, 214, 160, 0.12); color: var(--success); }
        .status.error { background: rgba(239, 71, 111, 0.12); color: var(--danger); }
        .status.warn { background: rgba(255, 209, 102, 0.12); color: var(--warning); }

        .status-window {
            margin-top: 1rem;
            max-height: 240px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 0.5rem;
            padding: 0.5rem;
        }

        .status-window .status {
            margin-top: 0.35rem;
            font-size: 0.85rem;
            padding: 0.5rem;
            min-height: auto;
        }

        .status-window .status:first-child {
            margin-top: 0;
        }

        .file-list { margin-top: 1rem; }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-light);
            padding: 0.85rem;
            border-radius: 0.6rem;
            margin-bottom: 0.6rem;
            gap: 0.75rem;
        }

        .file-item a {
            color: var(--heading);
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }

        .file-item span {
            color: #8b949e;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--heading);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .section-note {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }

        .inline-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            cursor: pointer;
        }

        .inline-label input {
            width: auto;
        }

        @media (max-width: 480px) {
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kinogomy Downloader</h1>
            <p>Pick an episode and download it to your device</p>
        </header>

        <div class="card">
            <h2>1. Paste title page URL</h2>
            <input type="text" id="url" value="{{ default_url }}" placeholder="https://kinogomy.net/...">
            <button id="loadBtn" onclick="loadEpisodes()">Load episodes</button>
            <div class="section-note" id="tgNote"></div>
        </div>

        <div class="card" id="episodeCard" style="display:none;">
            <h2>2. Single episode</h2>

            <label for="season">Season</label>
            <select id="season" onchange="updateEpisodes()"></select>

            <label for="episode">Episode</label>
            <select id="episode"></select>

            <label for="lang">Audio language</label>
            <select id="lang">
                <option value="eng" selected>English</option>
                <option value="rus">Russian</option>
                <option value="ukr">Ukrainian</option>
            </select>

            <label class="inline-label">
                <input type="checkbox" id="uploadTelegramSingle" checked> Upload to Telegram after download
            </label>
            <label class="inline-label">
                <input type="checkbox" id="deleteAfterUploadSingle"> Delete local file after Telegram upload
            </label>

            <button id="downloadBtn" onclick="startDownload()">Download episode</button>
            <div class="status-window" id="statusWindow"></div>
        </div>

        <div class="card" id="batchCard" style="display:none;">
            <h2>3. Batch download</h2>

            <div class="grid-3">
                <div>
                    <label for="batchSeason">Season</label>
                    <input type="number" id="batchSeason" value="1" min="1">
                </div>
                <div>
                    <label for="batchFrom">From</label>
                    <input type="number" id="batchFrom" value="1" min="1">
                </div>
                <div>
                    <label for="batchTo">To</label>
                    <input type="number" id="batchTo" value="5" min="1">
                </div>
            </div>

            <label for="batchLang">Audio language</label>
            <select id="batchLang">
                <option value="eng" selected>English</option>
                <option value="rus">Russian</option>
                <option value="ukr">Ukrainian</option>
            </select>

            <label class="inline-label">
                <input type="checkbox" id="uploadTelegramBatch" checked> Upload to Telegram after download
            </label>
            <label class="inline-label">
                <input type="checkbox" id="deleteAfterUploadBatch"> Delete local file after Telegram upload
            </label>

            <button id="batchDownloadBtn" onclick="startBatchDownload()">Download range</button>
            <div class="status-window" id="batchStatusWindow"></div>
            <p class="section-note">Only 3 episodes download at once; the rest queue automatically.</p>
        </div>

        <div class="card" id="selectCard" style="display:none;">
            <h2>4. Select episodes</h2>

            <label for="selectLang">Audio language</label>
            <select id="selectLang">
                <option value="eng" selected>English</option>
                <option value="rus">Russian</option>
                <option value="ukr">Ukrainian</option>
            </select>

            <label class="inline-label">
                <input type="checkbox" id="uploadTelegramSelect" checked> Upload to Telegram after download
            </label>
            <label class="inline-label">
                <input type="checkbox" id="deleteAfterUploadSelect"> Delete local file after Telegram upload
            </label>

            <div id="episodeSelector" style="margin-top:1rem;"></div>

            <button id="downloadSelectedBtn" onclick="startSelectedDownload()">Download selected</button>
            <div class="status-window" id="selectStatusWindow"></div>
        </div>

        <div class="card">
            <h2>Downloaded files</h2>
            <button class="btn-secondary" onclick="loadFiles()">Refresh list</button>
            <div class="file-list" id="fileList"></div>
        </div>
    </div>

    <script>
        let telegramConfigured = false;
        let episodeData = {};
        let activeJobs = {};

        function addJobRow(jobId, filename, windowId) {
            const win = document.getElementById(windowId);
            if (!win) return;
            const row = document.createElement('div');
            row.className = 'status downloading';
            row.id = 'job-' + jobId;
            row.innerHTML = '<span class="spinner"></span>' + filename + ' - starting';
            win.prepend(row);
            activeJobs[jobId] = {filename, windowId, rowEl: row};
        }

        function updateJobRow(jobId, status) {
            const job = activeJobs[jobId];
            if (!job) return;
            const row = job.rowEl;
            if (status === 'done' || status.startsWith('done +')) {
                row.className = 'status done';
                row.innerHTML = `<a href="/files/${encodeURIComponent(job.filename)}">${job.filename}</a> - ${status}`;
                loadFiles();
                setTimeout(() => removeJobRow(jobId), 15000);
            } else if (status.startsWith('failed')) {
                row.className = 'status error';
                row.textContent = job.filename + ' - ' + status;
                setTimeout(() => removeJobRow(jobId), 15000);
            } else {
                row.className = 'status downloading';
                row.innerHTML = '<span class="spinner"></span>' + job.filename + ' - ' + status;
            }
        }

        function removeJobRow(jobId) {
            const job = activeJobs[jobId];
            if (job && job.rowEl.parentNode) {
                job.rowEl.parentNode.removeChild(job.rowEl);
            }
            delete activeJobs[jobId];
        }

        function showSummary(windowId, text, type) {
            const win = document.getElementById(windowId);
            if (!win) return;
            const summary = document.createElement('div');
            summary.className = 'status' + (type ? ' ' + type : '');
            summary.textContent = text;
            win.prepend(summary);
        }

        setInterval(async () => {
            const jobIds = Object.keys(activeJobs);
            if (!jobIds.length) return;
            try {
                const res = await fetch('/status-bulk', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(jobIds)
                });
                const statuses = await res.json();
                jobIds.forEach(id => updateJobRow(id, statuses[id]?.status || 'unknown'));
            } catch (e) {
                // ignore polling errors
            }
        }, 2000);

        async function checkTelegramConfig() {
            const res = await fetch('/telegram-configured');
            const data = await res.json();
            telegramConfigured = data.configured;
            const note = document.getElementById('tgNote');
            if (telegramConfigured) {
                note.textContent = 'Telegram upload is configured.';
                note.style.color = 'var(--success)';
            } else {
                note.innerHTML = 'Telegram not configured. Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID to enable uploads.';
                note.style.color = 'var(--warning)';
            }
        }

        async function loadEpisodes() {
            const url = document.getElementById('url').value;
            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            const res = await fetch('/episodes', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'page_url=' + encodeURIComponent(url)
            });
            const data = await res.json();

            btn.disabled = false;
            btn.textContent = 'Load episodes';

            if (data.error) {
                alert(data.error);
                return;
            }

            episodeData = data.episodes;
            const seasonSelect = document.getElementById('season');
            seasonSelect.innerHTML = '';
            data.seasons.forEach(season => {
                const opt = document.createElement('option');
                opt.value = season;
                opt.textContent = season;
                seasonSelect.appendChild(opt);
            });

            document.getElementById('episodeCard').style.display = 'block';
            document.getElementById('batchCard').style.display = 'block';
            document.getElementById('selectCard').style.display = 'block';
            updateEpisodes();
            renderEpisodeSelector();
        }

        function updateEpisodes() {
            const season = document.getElementById('season').value;
            const epSelect = document.getElementById('episode');
            epSelect.innerHTML = '';
            (episodeData[season] || []).forEach(ep => {
                const opt = document.createElement('option');
                opt.value = ep.season + '|' + ep.episode;
                opt.textContent = `S${String(ep.season).padStart(2,'0')}E${String(ep.episode).padStart(2,'0')} - ${ep.audio.join(', ')}`;
                epSelect.appendChild(opt);
            });
        }

        async function startDownload() {
            const url = document.getElementById('url').value;
            const [s, e] = document.getElementById('episode').value.split('|');
            const lang = document.getElementById('lang').value;
            const uploadTelegram = document.getElementById('uploadTelegramSingle').checked;
            const deleteAfterUpload = document.getElementById('deleteAfterUploadSingle').checked;
            const btn = document.getElementById('downloadBtn');

            btn.disabled = true;

            const res = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `page_url=${encodeURIComponent(url)}&season=${s}&episode=${e}&lang=${lang}&upload_telegram=${uploadTelegram}&delete_after_upload=${deleteAfterUpload}`
            });
            const data = await res.json();
            btn.disabled = false;

            if (data.error) {
                showSummary('statusWindow', 'Error: ' + data.error, 'error');
                return;
            }

            addJobRow(data.job_id, data.filename, 'statusWindow');
        }

        function renderEpisodeSelector() {
            const container = document.getElementById('episodeSelector');
            container.innerHTML = '';

            Object.keys(episodeData).sort((a, b) => {
                return parseInt(a.split(' ')[1]) - parseInt(b.split(' ')[1]);
            }).forEach(season => {
                const seasonNum = season.split(' ')[1];
                const details = document.createElement('details');
                details.style.marginBottom = '0.75rem';
                details.style.background = '#202020';
                details.style.borderRadius = '0.5rem';
                details.style.padding = '0.5rem';
                details.open = true;

                const summary = document.createElement('summary');
                summary.style.fontWeight = '600';
                summary.style.cursor = 'pointer';
                summary.innerHTML = `${season} (${episodeData[season].length} episodes) <button type="button" class="btn-secondary" style="width:auto;padding:0.2rem 0.5rem;margin:0 0 0 0.5rem;font-size:0.75rem;" onclick="event.preventDefault();toggleSeason('${seasonNum}')">Toggle</button>`;
                details.appendChild(summary);

                const grid = document.createElement('div');
                grid.className = 'grid-4';
                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(80px, 1fr))';
                grid.style.gap = '0.4rem';
                grid.style.marginTop = '0.5rem';

                episodeData[season].forEach(ep => {
                    const label = document.createElement('label');
                    label.className = 'inline-label';
                    label.style.fontSize = '0.85rem';
                    label.style.margin = '0';
                    label.style.padding = '0.35rem';
                    label.style.background = 'var(--surface-light)';
                    label.style.borderRadius = '0.35rem';
                    label.innerHTML = `<input type="checkbox" class="ep-check" data-season="${ep.season}" data-episode="${ep.episode}"> E${String(ep.episode).padStart(2, '0')}`;
                    grid.appendChild(label);
                });

                details.appendChild(grid);
                container.appendChild(details);
            });
        }

        function toggleSeason(seasonNum) {
            const checks = document.querySelectorAll(`.ep-check[data-season="${seasonNum}"]`);
            const allChecked = Array.from(checks).every(c => c.checked);
            checks.forEach(c => c.checked = !allChecked);
        }

        function getSelectedEpisodes() {
            const selected = [];
            document.querySelectorAll('.ep-check:checked').forEach(box => {
                selected.push({
                    season: parseInt(box.dataset.season),
                    episode: parseInt(box.dataset.episode)
                });
            });
            return selected;
        }

        async function startSelectedDownload() {
            const url = document.getElementById('url').value;
            const lang = document.getElementById('selectLang').value;
            const uploadTelegram = document.getElementById('uploadTelegramSelect').checked;
            const deleteAfterUpload = document.getElementById('deleteAfterUploadSelect').checked;
            const btn = document.getElementById('downloadSelectedBtn');

            const episodes = getSelectedEpisodes();
            if (!episodes.length) {
                showSummary('selectStatusWindow', 'No episodes selected.', 'warn');
                return;
            }

            if (!confirm(`Download ${episodes.length} selected episodes?`)) {
                return;
            }

            btn.disabled = true;
            const res = await fetch('/download-selected', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    page_url: url,
                    lang: lang,
                    upload_telegram: uploadTelegram,
                    delete_after_upload: deleteAfterUpload,
                    episodes: episodes
                })
            });
            const data = await res.json();
            btn.disabled = false;

            if (data.error) {
                showSummary('selectStatusWindow', 'Error: ' + data.error, 'error');
                return;
            }

            showSummary('selectStatusWindow', `Queued ${data.count} episodes. Only 3 run at once.`, 'warn');
            data.job_ids.forEach((jobId, idx) => {
                addJobRow(jobId, `S${String(episodes[idx].season).padStart(2,'0')}E${String(episodes[idx].episode).padStart(2,'0')}`, 'selectStatusWindow');
            });
        }

        async function startBatchDownload() {
            const url = document.getElementById('url').value;
            const season = document.getElementById('batchSeason').value;
            const fromEp = document.getElementById('batchFrom').value;
            const toEp = document.getElementById('batchTo').value;
            const lang = document.getElementById('batchLang').value;
            const uploadTelegram = document.getElementById('uploadTelegramBatch').checked;
            const deleteAfterUpload = document.getElementById('deleteAfterUploadBatch').checked;
            const btn = document.getElementById('batchDownloadBtn');

            btn.disabled = true;
            const res = await fetch('/download-batch', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `page_url=${encodeURIComponent(url)}&season=${season}&episode_from=${fromEp}&episode_to=${toEp}&lang=${lang}&upload_telegram=${uploadTelegram}&delete_after_upload=${deleteAfterUpload}`
            });
            const data = await res.json();
            btn.disabled = false;

            if (data.error) {
                showSummary('batchStatusWindow', 'Error: ' + data.error, 'error');
                return;
            }

            showSummary('batchStatusWindow', `Queued ${data.count} episodes. Only 3 run at once.`, 'warn');
            data.job_ids.forEach((jobId, idx) => {
                const epNum = parseInt(fromEp) + idx;
                addJobRow(jobId, `S${String(season).padStart(2,'0')}E${String(epNum).padStart(2,'0')}`, 'batchStatusWindow');
            });
        }

        async function uploadFileToTelegram(filename, btn) {
            btn.disabled = true;
            btn.textContent = 'Sending...';
            const res = await fetch('/upload-telegram/' + encodeURIComponent(filename), {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'delete_after=true'
            });
            const data = await res.json();
            btn.disabled = false;
            if (data.ok) {
                btn.textContent = 'Sent & deleted';
                btn.style.color = 'var(--success)';
                loadFiles();
            } else {
                btn.textContent = 'Failed';
                btn.style.color = 'var(--danger)';
            }
        }

        async function loadFiles() {
            const res = await fetch('/files');
            const data = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            if (!data.files.length) {
                list.innerHTML = '<div class="section-note">No files yet.</div>';
                return;
            }
            data.files.forEach(file => {
                const sizeMb = (file.size / 1024 / 1024).toFixed(1);
                const div = document.createElement('div');
                div.className = 'file-item';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'flex-start';
                const tgButton = telegramConfigured
                    ? `<button class="btn-secondary" style="width:auto;padding:0.4rem 0.7rem;margin:0;font-size:0.8rem;" onclick="uploadFileToTelegram('${file.name.replace(/'/g, "\\'")}', this)">Send to Telegram</button>`
                    : '';
                div.innerHTML = `
                    <div style="display:flex;justify-content:space-between;width:100%;align-items:center;gap:0.75rem;">
                        <a href="/files/${encodeURIComponent(file.name)}">${file.name}</a>
                        <div style="display:flex;align-items:center;gap:0.75rem;">
                            <span>${sizeMb} MB</span>
                            ${tgButton}
                        </div>
                    </div>
                    <span class="small">${file.folder}</span>
                `;
                list.appendChild(div);
            });
        }

        checkTelegramConfig();
        loadFiles();
    </script>
</body>
</html>
