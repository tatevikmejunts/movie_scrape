<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinogomy Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            background: #0f0f0f;
            color: #eee;
        }
        h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        label { display: block; margin: 0.8rem 0 0.3rem; font-size: 0.9rem; color: #aaa; }
        input, select, button {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #eee;
        }
        button {
            background: #2563eb;
            border: none;
            margin-top: 1rem;
            font-weight: 600;
        }
        button:disabled { background: #334155; }
        .card {
            background: #181818;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }
        .status { margin-top: 1rem; font-size: 0.95rem; color: #93c5fd; }
        .file-list { margin-top: 1rem; }
        .file-item {
            background: #202020;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }
        .small { font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
    <h1>Kinogomy Downloader</h1>

    <div class="card">
        <label for="url">Title page URL</label>
        <input type="text" id="url" value="{{ default_url }}" placeholder="https://kinogomy.net/...">
        <button id="loadBtn" onclick="loadEpisodes()">Load episodes</button>
    </div>

    <div class="card" id="episodeCard" style="display:none;">
        <label for="season">Season</label>
        <select id="season" onchange="updateEpisodes()"></select>

        <label for="episode">Episode</label>
        <select id="episode"></select>

        <label for="lang">Audio language</label>
        <select id="lang">
            <option value="eng" selected>English</option>
            <option value="rus">Russian</option>
            <option value="ukr">Ukrainian</option>
        </select>

        <button id="downloadBtn" onclick="startDownload()">Download</button>
        <div class="status" id="status"></div>
    </div>

    <div class="card">
        <h2>Downloaded files</h2>
        <button onclick="loadFiles()">Refresh list</button>
        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        let episodeData = {};

        async function loadEpisodes() {
            const url = document.getElementById('url').value;
            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            const res = await fetch('/episodes', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'page_url=' + encodeURIComponent(url)
            });
            const data = await res.json();

            btn.disabled = false;
            btn.textContent = 'Load episodes';

            if (data.error) {
                alert(data.error);
                return;
            }

            episodeData = data.episodes;
            const seasonSelect = document.getElementById('season');
            seasonSelect.innerHTML = '';
            data.seasons.forEach(season => {
                const opt = document.createElement('option');
                opt.value = season;
                opt.textContent = season;
                seasonSelect.appendChild(opt);
            });

            document.getElementById('episodeCard').style.display = 'block';
            updateEpisodes();
        }

        function updateEpisodes() {
            const season = document.getElementById('season').value;
            const epSelect = document.getElementById('episode');
            epSelect.innerHTML = '';
            (episodeData[season] || []).forEach(ep => {
                const opt = document.createElement('option');
                opt.value = ep.season + '|' + ep.episode;
                opt.textContent = `S${String(ep.season).padStart(2,'0')}E${String(ep.episode).padStart(2,'0')} - ${ep.title || ''} (${ep.audio.join(', ')})`;
                epSelect.appendChild(opt);
            });
        }

        async function startDownload() {
            const url = document.getElementById('url').value;
            const season = document.getElementById('season').value.split(' ')[1];
            const [s, e] = document.getElementById('episode').value.split('|');
            const lang = document.getElementById('lang').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('downloadBtn');

            btn.disabled = true;
            status.textContent = 'Starting download...';

            const res = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `page_url=${encodeURIComponent(url)}&season=${s}&episode=${e}&lang=${lang}`
            });
            const data = await res.json();

            if (data.error) {
                status.textContent = 'Error: ' + data.error;
                btn.disabled = false;
                return;
            }

            status.textContent = 'Downloading ' + data.filename + '...';
            pollStatus(data.job_id, data.filename);
        }

        function pollStatus(jobId, filename) {
            const status = document.getElementById('status');
            const btn = document.getElementById('downloadBtn');
            const interval = setInterval(async () => {
                const res = await fetch('/status/' + jobId);
                const data = await res.json();
                status.textContent = data.status + ': ' + filename;
                if (data.status === 'done' || data.status.startsWith('failed')) {
                    clearInterval(interval);
                    btn.disabled = false;
                    loadFiles();
                    if (data.status === 'done') status.innerHTML = `Done: <a href="/files/${encodeURIComponent(filename)}">${filename}</a>`;
                }
            }, 2000);
        }

        async function loadFiles() {
            const res = await fetch('/files');
            const data = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            if (!data.files.length) {
                list.innerHTML = '<div class="small">No files yet.</div>';
                return;
            }
            data.files.forEach(file => {
                const sizeMb = (file.size / 1024 / 1024).toFixed(1);
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `<a href="/files/${encodeURIComponent(file.name)}">${file.name}</a> <span class="small">${sizeMb} MB</span>`;
                list.appendChild(div);
            });
        }

        loadFiles();
    </script>
</body>
</html>
